name: 'Dependency Review'
on:
  pull_request:
    paths:
      - '**pom.xml'
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@f5b971718edcbb31275a1db40004592335c0e031